research_themes:
  - number: "01"
    title: Complexity-constrained quantum information
    text: The study of quantum information when physically accessible operations are restricted to efficient state preparations, measurements, and transformations.
  - number: "02"
    title: Quantum cryptography
    text: The study of quantum cryptographic protocols built on computational assumptions, encompassing both near-term applications and fundamental questions.

