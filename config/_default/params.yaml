# Appearance for the remaining Hugo Blox-generated utility pages.
# The custom homepage and publication layouts use the cover-derived palette in
# assets/css/custom.css.
appearance:
  mode: light
  color: red

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: LIP6, Sorbonne Université
    description: 'Álvaro Yángüez studies the physical and operational consequences of computational complexity in quantum information and quantum cryptography.'
    twitter: alvaroyanguez16
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: c46cd77246c1add3
    baidu: ''

header:
  navbar:
    enable: true
    blox: navbar
    fixed_to_top: true
    show_search: false
    show_theme_chooser: false
    logo:
      text: Álvaro Yángüez

footer:
  copyright:
    notice: '© {year} Álvaro Yángüez'
    license:
      enable: false

locale:
  date_format: '2 Jan 2006'
  time_format: '15:04'

features:
  math:
    enable: true
  privacy_pack:
    enable: false
